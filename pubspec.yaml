name: careerly
description: Careerly AI — calm, bilingual career companion for CV scoring, ATS readiness, and job matching.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: any
  equatable: ^2.0.7
  collection: ^1.19.1
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  uuid: ^4.6.0
  archive: ^4.0.7
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#14213D"
  adaptive_icon_foreground: assets/icon/app_icon.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#14213D"
    theme_color: "#14213D"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/OFL.txt

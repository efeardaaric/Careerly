name: careerly
description: Careerly AI — calm, bilingual career companion for CV scoring, ATS readiness, and job matching.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: any
  equatable: ^2.0.7
  collection: ^1.19.1
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
